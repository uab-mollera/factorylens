<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Värmebehandlingsugn ikon</title>
  <desc id="desc">En enkel MES/SCADA-ikon av en industriell värmebehandlingsugn med glödande öppning, rullbana och kontrollpanel.</desc>

  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dde1"/>
      <stop offset="100%" stop-color="#8f9aa0"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc33"/>
      <stop offset="55%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#d94a00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Base shadow -->
  <ellipse cx="128" cy="224" rx="88" ry="10" fill="#1f2f38" opacity="0.12"/>

  <!-- Furnace body -->
  <g filter="url(#softShadow)" stroke="#20343d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M48 188V80l20-20h120l20 20v108Z" fill="url(#steel)"/>
    <path d="M73 176V103h110v73Z" fill="#5f6b70"/>
    <rect x="86" y="116" width="84" height="52" rx="7" fill="url(#heat)" stroke-width="0"/>
  </g>

  <!-- Heat waves / chimney -->
  <g fill="none" stroke="#20343d" stroke-width="8" stroke-linecap="round">
    <path d="M110 45c-10-10 10-17 0-29"/>
    <path d="M128 45c-10-10 10-17 0-29"/>
    <path d="M146 45c-10-10 10-17 0-29"/>
  </g>
  <rect x="111" y="53" width="34" height="17" rx="3" fill="#6f7b80" stroke="#20343d" stroke-width="8"/>

  <!-- Flame shape -->
  <path d="M92 161c7-15 4-25 14-34 4 13 13 10 15 0 10 13 16 17 14 33 6-8 11-14 20-17 0 10 5 16 9 18Z" fill="#ffd243" opacity="0.9"/>

  <!-- Steel billets inside furnace -->
  <g stroke="#20343d" stroke-width="6" stroke-linejoin="round">
    <path d="M89 169l14-31h23l-9 31Z" fill="#aeb7bc"/>
    <path d="M121 169l7-31h23l7 31Z" fill="#aeb7bc"/>
    <path d="M158 169l-9-31h23l14 31Z" fill="#aeb7bc"/>
  </g>

  <!-- Conveyor / rollers -->
  <g stroke="#20343d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="38" y="184" width="180" height="24" rx="10" fill="#384b54"/>
    <line x1="50" y1="213" x2="207" y2="213"/>
  </g>
  <g stroke="#20343d" stroke-width="5">
    <circle cx="58" cy="196" r="9" fill="#b8c1c5"/>
    <circle cx="92" cy="196" r="9" fill="#b8c1c5"/>
    <circle cx="128" cy="196" r="9" fill="#b8c1c5"/>
    <circle cx="164" cy="196" r="9" fill="#b8c1c5"/>
    <circle cx="198" cy="196" r="9" fill="#b8c1c5"/>
  </g>

  <!-- Control panel -->
  <g stroke="#20343d" stroke-width="7" stroke-linejoin="round">
    <path d="M211 104h20v74h-31v-63c0-6 5-11 11-11Z" fill="#34474f"/>
    <rect x="209" y="118" width="13" height="13" rx="2" fill="#c6cdd0" stroke-width="0"/>
    <circle cx="216" cy="145" r="6" fill="#ff7a00" stroke-width="0"/>
    <circle cx="216" cy="163" r="6" fill="#8cc63f" stroke-width="0"/>
  </g>
</svg>
